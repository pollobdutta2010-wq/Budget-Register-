const $=s=>document.querySelector(s),KEY="phed-register-v1";
const fmt=n=>"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dmy=i=>i?i.split("-").reverse().join("/"):"";
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let S=null,editId=null,toastT;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S||!S.ledgers||!S.ledgers.length)S={ledgers:JSON.parse(JSON.stringify(SEED)),cur:SEED[0].id};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",3500)};
const cur=()=>S.ledgers.find(l=>l.id===S.cur)||S.ledgers[0];
function calc(L){let rec=L.opening,sp=0;const rows=[{type:"open",part:"Budget received (opening)",amt:L.opening,prog:0,bal:L.opening,date:""}];
 L.entries.forEach(e=>{if(e.type==="alloc")rec+=e.amt;else sp+=e.amt;rows.push({...e,prog:sp,bal:rec-sp})});return{rows,rec,sp}}
function toISO(v){if(v instanceof Date){const d=new Date(v.getTime()+432e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
 const s=String(v??"");let m=s.match(/\d{4}-\d{2}-\d{2}/);if(m)return m[0];
 m=s.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:""}
function parseWB(wb){const out=[];
 wb.SheetNames.forEach(n=>{const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});
  const top=a.slice(0,4).map(r=>r.join(" ")).join("\n"),hm=top.match(/Head of Account:\s*([\w-]+)/i);if(!hm)return;
  const tot=top.match(/Total\s*:?\s*([\d,]+(?:\.\d+)?)/i),fn=top.match(/[\d,]+\.\d{2}/);
  const opening=tot?parseFloat(tot[1].replace(/,/g,"")):fn?parseFloat(fn[0].replace(/,/g,"")):0;
  const hi=a.findIndex(r=>r.some(c=>/^bill/i.test(String(c).trim())));if(hi<0)return;
  const c=a[hi].findIndex(c=>/^bill/i.test(String(c).trim())),entries=[];
  a.slice(hi+1).forEach(r=>{const k=String(r[c]).trim(),amt=parseFloat(String(r[c+3]).replace(/,/g,""));
   if(/^\d+$/.test(k)&&amt==amt)entries.push({id:uid(),type:"bill",no:k.padStart(5,"0"),date:toISO(r[c+1]),part:String(r[c+2]).replace(/\s+/g," ").trim(),amt});
   else if(/allocation/i.test(k)){const v=[...r].reverse().find(x=>typeof x==="number");if(v)entries.push({id:uid(),type:"alloc",no:"",date:toISO(k),part:k.replace(/\s*\(.*$/,""),amt:v})}});
  const t=String(a[0].find(x=>x)||"");
  out.push({id:uid(),label:n==="Sheet1"?"Main register":n,head:hm[1],sub:(t.split(/\n/)[1]||"").trim(),opening,entries})});
 return out}
function render(){const L=cur(),{rows,rec,sp}=calc(L);
 $("#sub").textContent=L.sub||"";$("#head").textContent="Head of Account: "+L.head;
 $("#tabs").innerHTML=S.ledgers.map(l=>`<button class="tab ${l.id===L.id?"on":""}" data-id="${l.id}">${esc(l.label)}</button>`).join("");
 $("#kpis").innerHTML=[["Budget received",fmt(rec)],["Expenditure",fmt(sp)],["Balance",fmt(rec-sp)]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v ${k=="Balance"&&rec-sp<0?"neg":""}">${v}</div></div>`).join("")
  +`<div class="card"><div class="k">Utilised</div><div class="v">${rec?(sp/rec*100).toFixed(1):0}%</div><div class="bar"><i style="width:${Math.min(100,rec?sp/rec*100:0)}%"></i></div></div>`;

 const ks=Object.keys(mt).sort(),mx=Math.max(1,...Object.values(mt));
 $("#months").innerHTML=ks.map(k=>`<div class="m" title="${fmt(mt[k])}"><b style="height:${Math.max(3,mt[k]/mx*60)}px"></b>${MN[+k.slice(5)-1]}</div>`).join("")||'<span class="sub">No dated bills</span>';
 const sel=$("#mo"),pv=sel.value;sel.innerHTML='<option value="">All months</option>'+ks.map(k=>`<option value="${k}">${MN[+k.slice(5)-1]} ${k.slice(0,4)}</option>`).join("");sel.value=ks.includes(pv)?pv:"";
 const q=$("#q").value.trim().toLowerCase(),mo=sel.value,cnt={};
 S.ledgers.forEach(l=>l.entries.forEach(e=>{if(e.no)cnt[e.no]=(cnt[e.no]||0)+1}));
 const list=rows.filter(r=>(!mo||(r.date||"").startsWith(mo))&&(!q||[r.no,r.part,r.amt,dmy(r.date)].join(" ").toLowerCase().includes(q)));
 $("#tb").innerHTML=list.map(r=>{const al=r.type!=="bill";
  return `<tr class="${al?"al":""}"><td>${esc(r.no||"")}${cnt[r.no]>1?'<span class="tag" title="Same bill number appears elsewhere in the register">dup</span>':""}</td><td>${dmy(r.date)}</td><td>${esc(r.part)}</td><td class="n">${al?"+ ":""}${fmt(r.amt)}</td><td class="n">${al?"":fmt(r.prog)}</td><td class="n ${r.bal<0?"neg":""}">${fmt(r.bal)}</td>
  <td class="act">${r.type==="open"?"":`<button data-a="e" data-id="${r.id}">Edit</button> <button data-a="d" data-id="${r.id}">Delete</button>`}</td></tr>`}).join("")||'<tr><td colspan="7" class="sub">No matching entries</td></tr>';
 const dups=Object.keys(cnt).filter(k=>cnt[k]>1);
 $("#note").textContent=(list.length-(list[0]&&list[0].type==="open"?1:0))+" entries shown"+(dups.length?` · Bill no. ${dups.join(", ")} appears in more than one register, please verify.`:"")}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-id]");if(b){S.cur=b.dataset.id;save();render()}};
$("#q").oninput=render;$("#mo").onchange=render;
$("#tb").onclick=e=>{const b=e.target.closest("button");if(!b)return;const L=cur();

function openDlg(e){editId=e?e.id:null;$("#dt").textContent=e?"Edit entry":"Add entry";
 $("#f_type").value=e?e.type:"bill";$("#f_no").value=e?e.no:"";$("#f_date").value=e?e.date:"";$("#f_part").value=e?e.part:"";$("#f_amt").value=e?e.amt:"";$("#dlg").showModal()}

$("#bUp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true}),p=parseWB(wb);
  if(!p.length){toast("No P.H.E.D. register sheets found in that file");return}
  p.forEach(n=>{const o=S.ledgers.find(l=>l.head===n.head);if(o){n.id=o.id;S.ledgers[S.ledgers.indexOf(o)]=n}else S.ledgers.push(n)});
  S.cur=p[0].id;save();render();toast(`Loaded ${p.length} register(s), ${p.reduce((s,l)=>s+l.entries.length,0)} entries`)}
 catch(err){toast("Could not read that file")}};
function aoa(L){return[["P.H.E.D \"BUDGET REGISTER\" (Head of Account: "+L.head+")"],[L.sub],[],["Bill No.","Date","Particulars","Bill Amount","Progressive Expenditure","Balance Amount"],
 ...calc(L).rows.map(r=>[r.no||"",dmy(r.date),r.part,r.amt,r.prog,r.bal])]}
async function dl(name,data){try{const d=await claude.use("downloads");if(!d){toast("Downloads are not available in this view");return}await d.save({filename:name,data})}catch(e){if(!e||e.code!=="declined")toast("Download failed")}}
$("#bX").onclick=()=>{const wb=XLSX.utils.book_new(),used={};
 S.ledgers.forEach(l=>{let n=l.label.replace(/[\\\/?*\[\]:]/g,"").slice(0,28)||"Register";if(used[n])n+=" "+(++used[n]);else used[n]=1;XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa(l)),n)});
 dl("PHED_Budget_Register_2026-27.xlsx",XLSX.write(wb,{type:"array",bookType:"xlsx"}))};
$("#bC").onclick=()=>{const L=cur(),csv=aoa(L).map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");dl("PHED_"+L.head+".csv","\ufeff"+csv)};
$("#bR").onclick=()=>{S={ledgers:JSON.parse(JSON.stringify(SEED)),cur:SEED[0].id};save();render();toast("Restored original data")};
render();
